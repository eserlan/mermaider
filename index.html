<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Viewer</title>
  <script>
    try {
      const storedTheme = localStorage.getItem('theme');
      document.documentElement.classList.toggle(
        'dark',
        storedTheme === 'dark' ||
        (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)
      );
    } catch {
      document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body { font-family: 'IBM Plex Sans', sans-serif; }
    code, textarea, .source-code { font-family: 'JetBrains Mono', monospace; }

    .file-input { display: none; }

    /* Drag over effect */
    body.drag-over .panel-shell { border-style: dashed; border-color: rgb(20 184 166); }

    .diagram-wrap.has-diagram { cursor: grab; }
    .diagram-wrap:active { cursor: grabbing; }
    .mermaid { margin: 0 auto; }
    .mermaid svg { display: block; max-width: none; height: auto; }

    .tool-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f6f0e4] bg-[linear-gradient(rgba(15,23,42,0.045)_1px,transparent_1px),linear-gradient(90deg,rgba(15,23,42,0.045)_1px,transparent_1px),linear-gradient(135deg,#f6f0e4_0%,#eef7f4_48%,#f8f4ec_100%)] bg-[size:28px_28px,28px_28px,100%_100%] text-stone-950 transition-colors duration-300 dark:bg-[#11100e] dark:bg-[linear-gradient(rgba(255,255,255,0.055)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.055)_1px,transparent_1px),linear-gradient(135deg,#11100e_0%,#12201d_52%,#171412_100%)] dark:text-stone-50">
  <div class="fixed inset-x-3 bottom-3 z-50 flex items-center justify-center gap-1.5 rounded-lg border border-stone-200/80 bg-[#fffaf0]/90 p-2 shadow-xl shadow-stone-900/10 backdrop-blur md:inset-x-auto md:bottom-6 md:right-6 md:justify-start md:gap-2 dark:border-stone-700/80 dark:bg-[#151a18]/90 dark:shadow-black/30">
    <button id="themeToggle" class="tool-btn inline-flex h-9 min-w-14 items-center justify-center rounded-md border border-stone-200 bg-white px-3 text-[11px] font-semibold text-stone-700 transition hover:-translate-y-0.5 hover:bg-stone-100 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" title="Toggle Theme" aria-label="Toggle theme">Moon</button>
    <div class="h-5 w-px shrink-0 bg-stone-200 dark:bg-stone-700"></div>
    <button id="zoomOut" class="tool-btn inline-flex size-9 items-center justify-center rounded-md border border-stone-200 bg-white text-sm font-semibold text-stone-700 transition hover:-translate-y-0.5 hover:bg-stone-100 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" title="Zoom out" aria-label="Zoom out">-</button>
    <span id="zoomLabel" class="min-w-10 text-center text-[11px] font-semibold text-stone-500 dark:text-stone-300 md:min-w-12 md:text-xs">100%</span>
    <button id="zoomIn" class="tool-btn inline-flex size-9 items-center justify-center rounded-md border border-stone-200 bg-white text-sm font-semibold text-stone-700 transition hover:-translate-y-0.5 hover:bg-stone-100 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" title="Zoom in" aria-label="Zoom in">+</button>
    <button id="zoomReset" class="tool-btn inline-flex h-9 min-w-16 items-center justify-center rounded-md border border-stone-200 bg-white px-3 text-[11px] font-semibold text-stone-700 transition hover:-translate-y-0.5 hover:bg-stone-100 md:h-8 md:text-xs dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" aria-label="Reset zoom">Reset</button>
  </div>

  <div class="flex min-h-screen flex-col p-0 sm:p-2 lg:p-3">
    <section class="panel-shell flex min-h-screen w-full flex-1 flex-col border-0 bg-[#fffaf0]/86 pb-24 pt-4 shadow-2xl shadow-stone-900/10 backdrop-blur-xl sm:min-h-0 sm:rounded-lg sm:border sm:border-white/70 sm:p-4 lg:p-5 dark:border-stone-800 dark:bg-[#111615]/84 dark:shadow-black/30">
      <header class="mb-3 sm:mb-4">
        <div class="px-4 sm:px-0">
          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex min-w-0 items-center gap-2">
              <div class="source-code min-w-0 flex-1 truncate rounded-md border border-stone-200 bg-white/75 px-3 py-2 text-xs font-semibold text-stone-600 shadow-sm dark:border-stone-700 dark:bg-stone-950/50 dark:text-stone-300">Source: <span id="sourcePath">demo.mmd</span></div>
              <button id="controlsToggle" class="tool-btn inline-flex h-9 shrink-0 items-center justify-center rounded-md border border-stone-200 bg-white px-3 text-[11px] font-semibold text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:bg-stone-100 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" type="button" aria-controls="mainControls" aria-expanded="false">Tools</button>
            </div>
            <div id="mainControls" class="hidden grid-cols-2 gap-2 sm:flex sm:flex-wrap sm:items-stretch sm:gap-3">
              <label class="tool-btn inline-flex h-11 cursor-pointer items-center justify-center rounded-md border border-teal-700 bg-teal-700 px-4 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-teal-800 sm:h-10" for="filePicker" aria-label="Open Mermaid file">
                Open
                <input id="filePicker" type="file" class="file-input" accept=".mmd,.md,.mermaid,.txt" />
              </label>
              <button id="clearDiagram" class="tool-btn inline-flex h-11 items-center justify-center rounded-md border border-amber-400 bg-amber-300 px-4 text-sm font-semibold text-stone-950 shadow-sm transition hover:-translate-y-0.5 hover:bg-amber-400 sm:h-10" aria-label="Clear diagram">Clear</button>
              <button id="savePng" class="tool-btn inline-flex h-11 items-center justify-center rounded-md border border-stone-200 bg-white px-4 text-sm font-semibold text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:bg-stone-100 sm:h-10 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" aria-label="Export PNG">PNG</button>
              <button id="saveSvg" class="tool-btn inline-flex h-11 items-center justify-center rounded-md border border-stone-200 bg-white px-4 text-sm font-semibold text-stone-700 shadow-sm transition hover:-translate-y-0.5 hover:bg-stone-100 sm:h-10 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-100 dark:hover:bg-stone-800" aria-label="Export SVG">SVG</button>
            </div>
          </div>
        </div>
      </header>

      <div id="inputPanel" class="hidden px-4 pb-4 sm:px-0 sm:pb-6">
        <div class="rounded-lg border border-teal-200 bg-white/82 p-3 shadow-sm dark:border-teal-900/70 dark:bg-stone-950/45">
          <label for="mermaidInput" class="mb-2 block text-xs font-bold uppercase tracking-[0.18em] text-teal-700 dark:text-teal-300">Paste Mermaid</label>
          <textarea id="mermaidInput" spellcheck="false" placeholder="flowchart TD&#10;  A[Start] --> B{Ready?}&#10;  B -->|Yes| C[Render]" class="source-code min-h-36 w-full resize-y rounded-md border border-stone-200 bg-[#fffdf8] px-4 py-3 text-sm text-stone-800 shadow-inner outline-none transition placeholder:text-stone-400 focus:border-teal-600 focus:ring-2 focus:ring-teal-100 dark:border-stone-700 dark:bg-stone-950 dark:text-stone-100 dark:placeholder:text-stone-500 dark:focus:border-teal-400 dark:focus:ring-teal-950"></textarea>
          <div class="mt-3 flex justify-end">
            <button id="renderInput" class="tool-btn inline-flex h-10 items-center justify-center rounded-md border border-teal-700 bg-teal-700 px-4 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-teal-800" aria-label="Render pasted Mermaid">Render</button>
          </div>
        </div>
      </div>

      <div class="diagram-wrap relative mx-0 flex min-h-[56vh] flex-1 justify-start overflow-auto border-y border-stone-200 bg-[#fffdf8] p-2 shadow-inner sm:rounded-lg sm:border sm:p-5 dark:border-stone-800 dark:bg-[#0d1110]">
        <div id="emptyState" class="pointer-events-none absolute inset-0 flex items-center justify-center px-8 text-center text-sm font-semibold text-stone-400 dark:text-stone-600">No diagram loaded</div>
        <pre class="mermaid" id="diagramSource"></pre>
      </div>

      <div id="statusText" class="mt-3 px-4 text-[11px] font-bold uppercase tracking-[0.18em] text-stone-500 sm:mt-4 sm:px-0 sm:text-xs dark:text-stone-400" aria-live="polite">Ready</div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    (function() {
      const defaultSourcePath = 'demo.mmd';
      const sourceParams = new URLSearchParams(window.location.search);
      const mermaidSourcePath = sourceParams.get('src') || defaultSourcePath;
      
      const elements = {
        wrap: document.querySelector('.diagram-wrap'),
        source: document.getElementById('diagramSource'),
        empty: document.getElementById('emptyState'),
        path: document.getElementById('sourcePath'),
        status: document.getElementById('statusText'),
        picker: document.getElementById('filePicker'),
        controlsPanel: document.getElementById('mainControls'),
        controlsToggle: document.getElementById('controlsToggle'),
        inputPanel: document.getElementById('inputPanel'),
        input: document.getElementById('mermaidInput'),
        renderInput: document.getElementById('renderInput'),
        clear: document.getElementById('clearDiagram'),
        png: document.getElementById('savePng'),
        svg: document.getElementById('saveSvg'),
        zoomLabel: document.getElementById('zoomLabel'),
        zoomIn: document.getElementById('zoomIn'),
        zoomOut: document.getElementById('zoomOut'),
        zoomReset: document.getElementById('zoomReset'),
        theme: document.getElementById('themeToggle')
      };

      let currentData = { name: '', text: '', zoom: 1, baseW: 0, baseH: 0 };
      let drag = { active: false, x: 0, y: 0, sL: 0, sT: 0 };
      let dragDepth = 0;
      let renderCount = 0;

      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

      function setInputVisible(visible) {
        elements.inputPanel.classList.toggle('hidden', !visible);
        if (visible) elements.input.focus();
      }

      function setControlsVisible(visible) {
        elements.controlsPanel.classList.toggle('hidden', !visible);
        elements.controlsPanel.classList.toggle('grid', visible);
        elements.controlsToggle.setAttribute('aria-expanded', String(visible));
        elements.controlsToggle.textContent = visible ? 'Hide' : 'Tools';
      }

      function setDiagramControlsEnabled(enabled) {
        elements.png.disabled = !enabled;
        elements.svg.disabled = !enabled;
        elements.wrap.classList.toggle('has-diagram', enabled);
        elements.empty.classList.toggle('hidden', enabled);
      }

      function setStatus(message) {
        elements.status.textContent = message;
      }

      function setCurrentDiagram(name, text, baseW = 0, baseH = 0) {
        currentData = {
          name,
          text,
          zoom: 1,
          baseW,
          baseH
        };
      }

      function updateZoom() {
        const svg = elements.source.querySelector('svg');
        if (!svg || !currentData.baseW) {
          elements.zoomLabel.textContent = Math.round(currentData.zoom * 100) + '%';
          return;
        }
        svg.style.width = Math.round(currentData.baseW * currentData.zoom) + 'px';
        svg.style.height = Math.round(currentData.baseH * currentData.zoom) + 'px';
        elements.zoomLabel.textContent = Math.round(currentData.zoom * 100) + '%';
      }

      function getRenderedSvgSize(svg) {
        const viewBox = svg.viewBox && svg.viewBox.baseVal;
        const rect = svg.getBoundingClientRect();
        const attrWidth = parseFloat(svg.getAttribute('width'));
        const attrHeight = parseFloat(svg.getAttribute('height'));
        return {
          width: viewBox && viewBox.width ? viewBox.width : rect.width || attrWidth || 0,
          height: viewBox && viewBox.height ? viewBox.height : rect.height || attrHeight || 0
        };
      }

      function zoomBy(delta) {
        if (!currentData.text) return;
        currentData.zoom = Math.min(3, Math.max(0.2, currentData.zoom + delta));
        updateZoom();
      }

      function resetZoom() {
        if (!currentData.text) return;
        currentData.zoom = 1;
        updateZoom();
      }

      function isTypingTarget(target) {
        return target && (
          target.tagName === 'TEXTAREA' ||
          target.tagName === 'INPUT' ||
          target.isContentEditable
        );
      }

      function handleZoomKeys(e) {
        if (isTypingTarget(e.target)) return;
        if (e.key === '+' || e.key === '=') {
          e.preventDefault();
          zoomBy(0.1);
        } else if (e.key === '-' || e.key === '_') {
          e.preventDefault();
          zoomBy(-0.1);
        } else if (e.key === '0') {
          e.preventDefault();
          resetZoom();
        }
      }

      function clearDiagram() {
        setCurrentDiagram('', '');
        elements.source.innerHTML = '';
        elements.source.style.color = '';
        elements.source.style.padding = '';
        elements.input.value = '';
        elements.path.textContent = 'Pasted or cleared';
        document.title = 'Mermaid Viewer';
        elements.wrap.scrollLeft = 0;
        elements.wrap.scrollTop = 0;
        setInputVisible(true);
        updateZoom();
        setDiagramControlsEnabled(false);
        setStatus('Paste Mermaid to render');
      }

      async function render(text, name) {
        try {
          setStatus('Rendering...');
          const cleanText = text.trim().replace(/^```mermaid\s*|\s*```$/gi, '');
          if (!cleanText) {
            clearDiagram();
            return;
          }
          const displayName = name.split('/').pop() || 'pasted.mmd';
          elements.input.value = cleanText;
          elements.path.textContent = name;
          document.title = displayName + ' - Mermaid Viewer';

          const { svg } = await mermaid.render('d' + (++renderCount), cleanText);
          elements.source.style.color = '';
          elements.source.style.padding = '';
          elements.source.innerHTML = svg;
          
          const svgEl = elements.source.querySelector('svg');
          const size = getRenderedSvgSize(svgEl);
          setCurrentDiagram(
            displayName,
            cleanText,
            size.width,
            size.height
          );
          elements.wrap.scrollLeft = 0; elements.wrap.scrollTop = 0;
          updateZoom();
          setInputVisible(false);
          setDiagramControlsEnabled(true);
          setStatus('Loaded: ' + currentData.name);
        } catch (e) {
          setStatus('Error: ' + e.message);
          setCurrentDiagram('', '');
          elements.source.style.color = '#dc2626';
          elements.source.style.padding = '20px';
          elements.source.textContent = e.message;
          if (name === 'pasted.mmd') setInputVisible(true);
          updateZoom();
          setDiagramControlsEnabled(false);
          elements.empty.classList.add('hidden');
        }
      }

      // Theme
      function setTheme(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        elements.theme.textContent = isDark ? 'Sun' : 'Moon';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }
      const initialDark = localStorage.getItem('theme') === 'dark' || 
                         (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      setTheme(initialDark);
      elements.theme.onclick = () => setTheme(!document.documentElement.classList.contains('dark'));

      // Zoom
      elements.zoomIn.onclick = () => zoomBy(0.1);
      elements.zoomOut.onclick = () => zoomBy(-0.1);
      elements.zoomReset.onclick = () => resetZoom();
      document.addEventListener('keydown', handleZoomKeys);

      // File loading
      elements.picker.onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          await render(await file.text(), file.name);
        } catch (err) {
          setStatus('Error: ' + err.message);
        } finally {
          elements.picker.value = '';
        }
      };
      elements.renderInput.onclick = () => render(elements.input.value, 'pasted.mmd');
      elements.clear.onclick = () => clearDiagram();
      elements.controlsToggle.onclick = () => setControlsVisible(elements.controlsPanel.classList.contains('hidden'));
      elements.input.onkeydown = e => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          render(elements.input.value, 'pasted.mmd');
        }
      };

      // Drag & Drop
      window.ondragenter = e => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
        e.preventDefault();
        dragDepth += 1;
        document.body.classList.add('drag-over');
      };
      window.ondragover = e => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
        e.preventDefault();
      };
      window.ondragleave = e => {
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) document.body.classList.remove('drag-over');
      };
      window.ondrop = async e => {
        e.preventDefault();
        dragDepth = 0;
        document.body.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (!file) return;
        try {
          await render(await file.text(), file.name);
        } catch (err) {
          setStatus('Error: ' + err.message);
        }
      };

      // Panning
      elements.wrap.onpointerdown = e => {
        if (e.button !== 0 || !currentData.text) return;
        drag = { active: true, x: e.clientX, y: e.clientY, sL: elements.wrap.scrollLeft, sT: elements.wrap.scrollTop };
        elements.wrap.setPointerCapture(e.pointerId);
      };
      elements.wrap.onpointermove = e => {
        if (!drag.active) return;
        elements.wrap.scrollLeft = drag.sL - (e.clientX - drag.x);
        elements.wrap.scrollTop = drag.sT - (e.clientY - drag.y);
      };
      elements.wrap.onpointerup = () => drag.active = false;

      // Exports
      async function getExportSvg() {
        if (!currentData.text) throw new Error('No diagram to export');
        const { svg } = await mermaid.render('exp' + (++renderCount), currentData.text.replace(/<br\s*\/?>/gi, '\n'));
        const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
        const el = doc.documentElement;
        el.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        const bg = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', 'white');
        el.insertBefore(bg, el.firstChild);
        return new XMLSerializer().serializeToString(el);
      }

      function download(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name;
        a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      elements.svg.onclick = async () => {
        try {
          const svg = await getExportSvg();
          download(new Blob([svg], {type:'image/svg+xml'}), currentData.name + '.svg');
        } catch (e) {
          setStatus('Error: ' + e.message);
        }
      };

      elements.png.onclick = async () => {
        try {
          const svg = await getExportSvg();
          const img = new Image();
          img.onload = () => {
            const cvs = document.createElement('canvas');
            cvs.width = img.width; cvs.height = img.height;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = 'white'; ctx.fillRect(0, 0, cvs.width, cvs.height);
            ctx.drawImage(img, 0, 0);
            cvs.toBlob(b => download(b, currentData.name + '.png'), 'image/png');
          };
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        } catch (e) {
          setStatus('Error: ' + e.message);
        }
      };

      // Start
      setDiagramControlsEnabled(false);
      fetch(mermaidSourcePath)
        .then(r => r.ok ? r.text() : Promise.reject(new Error('Unable to load ' + mermaidSourcePath)))
        .then(t => render(t, mermaidSourcePath))
        .catch(() => {
          elements.path.textContent = 'Paste Mermaid or open a file';
          setStatus('Press Clear to paste Mermaid');
          updateZoom();
        });
    })();
  </script>
</body>
</html>
