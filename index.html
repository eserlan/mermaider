<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Viewer</title>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }

    .file-input { display: none; }

    /* Drag over effect */
    body.drag-over { background-color: rgba(37, 99, 235, 0.08); }
    body.drag-over .panel-shell { border-style: dashed; border-color: rgb(37 99 235); }

    .diagram-wrap { cursor: grab; }
    .diagram-wrap:active { cursor: grabbing; }
    .mermaid svg { display: block; max-width: none; height: auto; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.15),_transparent_38%),linear-gradient(180deg,_#f8fafc_0%,_#e2e8f0_100%)] text-slate-950 transition-colors duration-300 dark:bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.18),_transparent_34%),linear-gradient(180deg,_#020617_0%,_#0f172a_100%)] dark:text-slate-50">
  <div class="fixed bottom-4 right-4 z-50 flex scale-90 items-center gap-2 rounded-full border border-slate-200/80 bg-white/85 p-2 shadow-xl shadow-slate-900/10 backdrop-blur md:bottom-6 md:right-6 md:scale-100 dark:border-slate-700/80 dark:bg-slate-900/85 dark:shadow-black/30">
    <button id="themeToggle" class="inline-flex size-9 items-center justify-center rounded-full border border-slate-200 bg-white text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700" title="Toggle Theme">🌙</button>
    <div class="h-5 w-px bg-slate-200 dark:bg-slate-700"></div>
    <button id="zoomOut" class="inline-flex size-9 items-center justify-center rounded-full border border-slate-200 bg-white text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">-</button>
    <span id="zoomLabel" class="min-w-12 text-center text-xs font-semibold text-slate-500 dark:text-slate-300">100%</span>
    <button id="zoomIn" class="inline-flex size-9 items-center justify-center rounded-full border border-slate-200 bg-white text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">+</button>
    <button id="zoomReset" class="inline-flex h-8 items-center justify-center rounded-full border border-slate-200 bg-white px-3 text-xs font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">Reset</button>
  </div>

  <div class="flex min-h-screen flex-col p-0 sm:p-5">
    <section class="panel-shell flex min-h-screen w-full flex-1 flex-col border-0 bg-white/80 p-5 shadow-2xl shadow-slate-900/10 backdrop-blur-xl sm:mx-auto sm:min-h-0 sm:max-w-6xl sm:rounded-3xl sm:border sm:border-white/70 sm:p-6 dark:border-slate-800 dark:bg-slate-950/70 dark:shadow-black/30">
      <header class="mb-6">
        <h1 class="text-2xl font-black tracking-tight text-slate-950 dark:text-slate-50">Mermaid Viewer</h1>
        <p class="mt-1 hidden text-sm text-slate-500 sm:block dark:text-slate-400">Explore diagrams with zoom and pan. Drag and drop files anywhere.</p>
        <div class="mt-4 flex flex-wrap items-center gap-3">
          <div class="w-full rounded-lg bg-slate-100 px-3 py-2 font-mono text-xs text-slate-500 dark:bg-slate-800 dark:text-slate-300">Source: <span id="sourcePath">demo.mmd</span></div>
          <label class="inline-flex h-10 cursor-pointer items-center justify-center rounded-full border border-blue-600 bg-blue-600 px-4 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:bg-blue-700" for="filePicker">
            Open File
            <input id="filePicker" type="file" class="file-input" accept=".mmd,.md,.mermaid,.txt" />
          </label>
          <button id="savePng" class="inline-flex h-10 items-center justify-center rounded-full border border-slate-200 bg-white px-4 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">PNG</button>
          <button id="saveSvg" class="inline-flex h-10 items-center justify-center rounded-full border border-slate-200 bg-white px-4 text-sm font-semibold text-slate-700 transition hover:-translate-y-0.5 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700">SVG</button>
        </div>
      </header>

      <div class="diagram-wrap flex flex-1 justify-center overflow-auto rounded-2xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-950">
        <pre class="mermaid" id="diagramSource"></pre>
      </div>

      <div id="statusText" class="mt-4 text-xs font-bold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">Ready</div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    (function() {
      const defaultSourcePath = 'demo.mmd';
      const sourceParams = new URLSearchParams(window.location.search);
      const mermaidSourcePath = sourceParams.get('src') || defaultSourcePath;
      
      const elements = {
        wrap: document.querySelector('.diagram-wrap'),
        source: document.getElementById('diagramSource'),
        title: document.getElementById('pageTitle'),
        path: document.getElementById('sourcePath'),
        status: document.getElementById('statusText'),
        picker: document.getElementById('filePicker'),
        png: document.getElementById('savePng'),
        svg: document.getElementById('saveSvg'),
        zoomLabel: document.getElementById('zoomLabel'),
        zoomIn: document.getElementById('zoomIn'),
        zoomOut: document.getElementById('zoomOut'),
        zoomReset: document.getElementById('zoomReset'),
        theme: document.getElementById('themeToggle')
      };

      let currentData = { name: '', text: '', zoom: 1, baseW: 0, baseH: 0 };
      let drag = { active: false, x: 0, y: 0, sL: 0, sT: 0 };

      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });

      function updateZoom() {
        const svg = elements.source.querySelector('svg');
        if (!svg || !currentData.baseW) return;
        svg.style.width = Math.round(currentData.baseW * currentData.zoom) + 'px';
        svg.style.height = Math.round(currentData.baseH * currentData.zoom) + 'px';
        elements.zoomLabel.textContent = Math.round(currentData.zoom * 100) + '%';
      }

      async function render(text, name) {
        try {
          elements.status.textContent = 'Rendering...';
          const cleanText = text.trim().replace(/^```mermaid\s*|\s*```$/gi, '');
          currentData.text = cleanText;
          currentData.name = name.split('/').pop();
          elements.path.textContent = name;
          document.title = currentData.name + ' - Mermaid Viewer';

          const { svg } = await mermaid.render('d' + Date.now(), cleanText);
          elements.source.innerHTML = svg;
          
          const svgEl = elements.source.querySelector('svg');
          const vb = svgEl.viewBox.baseVal;
          currentData.baseW = vb.width || svgEl.getBoundingClientRect().width;
          currentData.baseH = vb.height || svgEl.getBoundingClientRect().height;
          
          currentData.zoom = 1;
          elements.wrap.scrollLeft = 0; elements.wrap.scrollTop = 0;
          updateZoom();
          elements.status.textContent = 'Loaded: ' + currentData.name;
        } catch (e) {
          elements.status.textContent = 'Error: ' + e.message;
          elements.source.innerHTML = `<pre style="color:#ef4444;padding:20px">${e.message}</pre>`;
        }
      }

      // Theme
      function setTheme(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        elements.theme.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      }
      const initialDark = localStorage.getItem('theme') === 'dark' || 
                         (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      setTheme(initialDark);
      elements.theme.onclick = () => setTheme(!document.documentElement.classList.contains('dark'));

      // Zoom
      elements.zoomIn.onclick = () => { currentData.zoom = Math.min(3, currentData.zoom + 0.1); updateZoom(); };
      elements.zoomOut.onclick = () => { currentData.zoom = Math.max(0.2, currentData.zoom - 0.1); updateZoom(); };
      elements.zoomReset.onclick = () => { currentData.zoom = 1; updateZoom(); };

      // File loading
      elements.picker.onchange = async e => {
        const file = e.target.files[0];
        if (file) render(await file.text(), file.name);
      };

      // Drag & Drop
      window.ondragover = e => { e.preventDefault(); document.body.classList.add('drag-over'); };
      window.ondragleave = e => { if (!e.relatedTarget) document.body.classList.remove('drag-over'); };
      window.ondrop = async e => {
        e.preventDefault(); document.body.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) render(await file.text(), file.name);
      };

      // Panning
      elements.wrap.onpointerdown = e => {
        if (e.button !== 0) return;
        drag = { active: true, x: e.clientX, y: e.clientY, sL: elements.wrap.scrollLeft, sT: elements.wrap.scrollTop };
        elements.wrap.setPointerCapture(e.pointerId);
      };
      elements.wrap.onpointermove = e => {
        if (!drag.active) return;
        elements.wrap.scrollLeft = drag.sL - (e.clientX - drag.x);
        elements.wrap.scrollTop = drag.sT - (e.clientY - drag.y);
      };
      elements.wrap.onpointerup = () => drag.active = false;

      // Exports
      async function getExportSvg() {
        const { svg } = await mermaid.render('exp', currentData.text.replace(/<br\s*\/?>/gi, '\n'));
        const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
        const el = doc.documentElement;
        el.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        const bg = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', '100%'); bg.setAttribute('height', '100%'); bg.setAttribute('fill', 'white');
        el.insertBefore(bg, el.firstChild);
        return new XMLSerializer().serializeToString(el);
      }

      function download(blob, name) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name;
        a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      elements.svg.onclick = async () => {
        const svg = await getExportSvg();
        download(new Blob([svg], {type:'image/svg+xml'}), currentData.name + '.svg');
      };

      elements.png.onclick = async () => {
        const svg = await getExportSvg();
        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement('canvas');
          cvs.width = img.width; cvs.height = img.height;
          const ctx = cvs.getContext('2d');
          ctx.fillStyle = 'white'; ctx.fillRect(0, 0, cvs.width, cvs.height);
          ctx.drawImage(img, 0, 0);
          cvs.toBlob(b => download(b, currentData.name + '.png'), 'image/png');
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      };

      // Start
      fetch(mermaidSourcePath).then(r => r.text()).then(t => render(t, mermaidSourcePath));
    })();
  </script>
</body>
</html>
