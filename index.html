<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Process Diagram</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: rgba(255, 255, 255, 0.9);
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }

    .page {
      min-height: 100vh;
      padding: 20px;
    }

    .panel {
      max-width: 100%;
      padding: 18px 20px;
      border: 1px solid rgba(216, 223, 235, 0.9);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(216, 223, 235, 0.95);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.16);
    }

    button {
      border: 1px solid rgba(216, 223, 235, 1);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      min-width: 42px;
      height: 42px;
      padding: 0 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      background: #f3f6fb;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
    }

    .zoom-label {
      color: var(--muted);
      font-size: 0.9rem;
      min-width: 54px;
      text-align: center;
    }

    .diagram-wrap {
      margin-top: 18px;
      overflow: auto;
      border: 1px solid rgba(216, 223, 235, 0.95);
      border-radius: 22px;
      background: #ffffff;
      box-shadow: var(--shadow);
      padding: 16px;
      cursor: grab;
      user-select: none;
    }

    .diagram-wrap.dragging {
      cursor: grabbing;
    }

    .mermaid {
      min-width: max-content;
    }

    .mermaid svg {
      display: block;
      max-width: none;
      height: auto;
    }

    .status {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(216, 223, 235, 0.95);
      color: var(--muted);
      font-size: 0.85rem;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    .source-info {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .file-picker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(216, 223, 235, 1);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .file-picker:hover {
      background: #f3f6fb;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
    }

    .file-picker input {
      display: none;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(216, 223, 235, 1);
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .action-button:hover {
      background: #f3f6fb;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
    }

    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .action-button.is-busy {
      position: relative;
      padding-right: 38px;
    }

    .action-button.is-busy::after {
      content: '';
      position: absolute;
      right: 14px;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(31, 41, 55, 0.18);
      border-top-color: rgba(31, 41, 55, 0.85);
      border-radius: 50%;
      animation: export-spin 0.8s linear infinite;
    }

    @keyframes export-spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>
</head>
<body>
  <div class="controls">
    <button id="zoomOut" type="button">Zoom out</button>
    <button id="zoomIn" type="button">Zoom in</button>
    <button id="zoomReset" type="button">Reset</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
  </div>
  <div class="page">
    <section class="panel">
      <div>
      <h1 id="pageTitle">Mermaid Viewer</h1>
      <p>Loads Mermaid from an external file. Use + and - to zoom.</p>
      <div class="header-actions">
        <div class="source-info">Source: <span id="sourcePath">demo.mmd</span></div>
        <label class="file-picker" for="filePicker">
          Open Mermaid file
          <input id="filePicker" type="file" accept=".mmd,.md,.mermaid,.txt" />
        </label>
        <button class="action-button" id="savePng" type="button">Save PNG</button>
        <button class="action-button" id="saveSvg" type="button">Save SVG</button>
      </div>
      </div>
      <div class="diagram-wrap">
      <pre class="mermaid" id="diagramSource" aria-label="Mermaid diagram"></pre>
      </div>
      <div class="status" id="statusText">Loading Mermaid…</div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    const defaultSourcePath = 'demo.mmd';
    const sourceParams = new URLSearchParams(window.location.search);
    const mermaidSourcePath = sourceParams.get('src') || defaultSourcePath;
    const diagramWrap = document.querySelector('.diagram-wrap');
    const diagramSource = document.getElementById('diagramSource');
    const pageTitle = document.getElementById('pageTitle');
    const sourcePath = document.getElementById('sourcePath');
    const statusText = document.getElementById('statusText');
    const filePicker = document.getElementById('filePicker');
    const savePngButton = document.getElementById('savePng');
    const saveSvgButton = document.getElementById('saveSvg');
    const zoomLabel = document.getElementById('zoomLabel');
    const zoomInButton = document.getElementById('zoomIn');
    const zoomOutButton = document.getElementById('zoomOut');
    const zoomResetButton = document.getElementById('zoomReset');
    const screenMermaidConfig = {
      startOnLoad: false,
      securityLevel: 'loose',
      flowchart: {
        useMaxWidth: false,
        htmlLabels: true
      }
    };
    const exportMermaidConfig = {
      startOnLoad: false,
      securityLevel: 'loose',
      flowchart: {
        useMaxWidth: false,
        htmlLabels: false
      }
    };

    let currentDiagramName = getFileName(mermaidSourcePath);
    let currentDiagramText = '';
    let currentZoom = 1;
    let baseWidth = 0;
    let baseHeight = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartScrollLeft = 0;
    let dragStartScrollTop = 0;

    sourcePath.textContent = mermaidSourcePath;

    function getFileName(path) {
      return path.split('/').pop().split('\\').pop() || path;
    }

    async function loadDiagramSource(path) {
      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`Could not load Mermaid source: ${path}`);
      }

      return response.text();
    }

    function normalizeMermaidSource(sourceText) {
      const trimmed = sourceText.trim();
      const fencedMatch = trimmed.match(/^```(?:mermaid[\w.-]*)?\s*\r?\n([\s\S]*?)\r?\n```$/i);
      if (fencedMatch) {
        return fencedMatch[1].trim();
      }

      const embeddedMatch = sourceText.match(/```(?:mermaid[\w.-]*)?\s*\r?\n([\s\S]*?)\r?\n```/i);
      if (embeddedMatch) {
        return embeddedMatch[1].trim();
      }

      return trimmed;
    }

    function setViewerTitle(displayName) {
      sourcePath.textContent = displayName;
      currentDiagramName = getFileName(displayName);
      pageTitle.textContent = currentDiagramName;
      document.title = `${currentDiagramName} - Mermaid Viewer`;
    }

    function getExportBaseName() {
      return (currentDiagramName || 'mermaid-diagram').replace(/\.[^.]+$/, '') || 'mermaid-diagram';
    }

    function downloadBlob(blob, fileName) {
      const blobUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
    }

    function prepareDiagramTextForExport(diagramText) {
      return diagramText.replace(/<br\s*\/?>/gi, '\n');
    }

    async function createExportSvgMarkup() {
      if (!currentDiagramText) {
        throw new Error('No Mermaid source is available to export.');
      }

      mermaid.initialize(exportMermaidConfig);

      try {
        const exportRenderId = `diagram-export-${Date.now()}`;
        const exportDiagramText = prepareDiagramTextForExport(currentDiagramText);
        const { svg } = await mermaid.render(exportRenderId, exportDiagramText);

        const parser = new DOMParser();
        const svgDocument = parser.parseFromString(svg, 'image/svg+xml');
        const svgElement = svgDocument.documentElement;

        if (!svgElement || svgElement.nodeName.toLowerCase() !== 'svg') {
          throw new Error('Could not prepare SVG for export.');
        }

        const viewBox = svgElement.viewBox && svgElement.viewBox.baseVal
          ? svgElement.viewBox.baseVal
          : null;
        const exportWidth = Math.max(1, Math.round((viewBox && viewBox.width) || baseWidth || 1));
        const exportHeight = Math.max(1, Math.round((viewBox && viewBox.height) || baseHeight || 1));

        svgElement.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        svgElement.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
        svgElement.setAttribute('width', String(exportWidth));
        svgElement.setAttribute('height', String(exportHeight));

        if (!svgElement.getAttribute('viewBox')) {
          svgElement.setAttribute('viewBox', `0 0 ${exportWidth} ${exportHeight}`);
        }

        const backgroundRect = svgDocument.createElementNS('http://www.w3.org/2000/svg', 'rect');
        backgroundRect.setAttribute('x', '0');
        backgroundRect.setAttribute('y', '0');
        backgroundRect.setAttribute('width', '100%');
        backgroundRect.setAttribute('height', '100%');
        backgroundRect.setAttribute('fill', '#ffffff');
        svgElement.insertBefore(backgroundRect, svgElement.firstChild);

        return new XMLSerializer().serializeToString(svgElement);
      } finally {
        mermaid.initialize(screenMermaidConfig);
      }
    }

    async function exportSvg() {
      const svgMarkup = await createExportSvgMarkup();
      downloadBlob(new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' }), `${getExportBaseName()}.svg`);
    }

    async function exportPng() {
      const svgMarkup = await createExportSvgMarkup();
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgMarkup)}`;

      try {
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error('Could not convert SVG to PNG.'));
          image.src = svgUrl;
        });

        const exportWidth = Math.max(1, Math.round(image.naturalWidth || image.width || baseWidth || 1));
        const exportHeight = Math.max(1, Math.round(image.naturalHeight || image.height || baseHeight || 1));
        const pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(exportWidth * pixelRatio);
        canvas.height = Math.round(exportHeight * pixelRatio);
        canvas.style.width = `${exportWidth}px`;
        canvas.style.height = `${exportHeight}px`;

        const context = canvas.getContext('2d');
        if (!context) {
          throw new Error('Could not create canvas for PNG export.');
        }

        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, exportWidth, exportHeight);
        context.drawImage(image, 0, 0, exportWidth, exportHeight);

        const pngBlob = await new Promise((resolve) => {
          if (canvas.toBlob) {
            canvas.toBlob(resolve, 'image/png');
            return;
          }

          const dataUrl = canvas.toDataURL('image/png');
          const base64 = dataUrl.split(',')[1] || '';
          const byteCharacters = atob(base64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let index = 0; index < byteCharacters.length; index += 1) {
            byteNumbers[index] = byteCharacters.charCodeAt(index);
          }
          resolve(new Blob([new Uint8Array(byteNumbers)], { type: 'image/png' }));
        });

        if (!(pngBlob instanceof Blob)) {
          throw new Error('Could not create PNG file.');
        }

        downloadBlob(pngBlob, `${getExportBaseName()}.png`);
      } catch (error) {
        throw new Error(`PNG export failed: ${error.message}`);
      }
    }

    function updateZoomLabel() {
      zoomLabel.textContent = `${Math.round(currentZoom * 100)}%`;
    }

    function setExportState(button, busyText, isBusy) {
      if (!button.dataset.defaultLabel) {
        button.dataset.defaultLabel = button.textContent;
      }

      button.disabled = isBusy;
      button.classList.toggle('is-busy', isBusy);
      button.textContent = isBusy ? busyText : button.dataset.defaultLabel;
    }

    function applyZoom() {
      const svg = diagramSource.querySelector('svg');
      if (!svg || !baseWidth || !baseHeight) {
        return;
      }

      svg.style.width = `${Math.round(baseWidth * currentZoom)}px`;
      svg.style.height = `${Math.round(baseHeight * currentZoom)}px`;
      updateZoomLabel();
    }

    function setZoom(nextZoom) {
      currentZoom = Math.min(3, Math.max(0.4, nextZoom));
      applyZoom();
    }

    function zoomAtPoint(nextZoom, clientX, clientY) {
      const svg = diagramSource.querySelector('svg');
      if (!svg || !baseWidth || !baseHeight) {
        return;
      }

      const previousZoom = currentZoom;
      const boundedZoom = Math.min(3, Math.max(0.4, nextZoom));
      if (boundedZoom === previousZoom) {
        return;
      }

      const wrapRect = diagramWrap.getBoundingClientRect();
      const offsetX = clientX - wrapRect.left + diagramWrap.scrollLeft;
      const offsetY = clientY - wrapRect.top + diagramWrap.scrollTop;
      const ratioX = offsetX / (baseWidth * previousZoom);
      const ratioY = offsetY / (baseHeight * previousZoom);

      currentZoom = boundedZoom;
      applyZoom();

      diagramWrap.scrollLeft = ratioX * (baseWidth * currentZoom) - (clientX - wrapRect.left);
      diagramWrap.scrollTop = ratioY * (baseHeight * currentZoom) - (clientY - wrapRect.top);
    }

    async function renderMermaidSource(diagramText, displayName) {
      const normalizedDiagramText = normalizeMermaidSource(diagramText);
      if (!normalizedDiagramText) {
        throw new Error(`No Mermaid content found in ${displayName}`);
      }

      currentDiagramText = normalizedDiagramText;
      setViewerTitle(displayName);

      const renderId = `diagram-${Date.now()}`;
      const { svg } = await mermaid.render(renderId, currentDiagramText);
      diagramSource.innerHTML = svg;

      const svgElement = diagramSource.querySelector('svg');
      if (!svgElement) {
        throw new Error('Mermaid did not produce an SVG.');
      }

      const viewBox = svgElement.viewBox && svgElement.viewBox.baseVal;
      baseWidth = viewBox && viewBox.width ? viewBox.width : svgElement.getBoundingClientRect().width;
      baseHeight = viewBox && viewBox.height ? viewBox.height : svgElement.getBoundingClientRect().height;

      currentZoom = 1;
      diagramWrap.scrollLeft = 0;
      diagramWrap.scrollTop = 0;
      applyZoom();

      statusText.textContent = 'Mermaid diagram loaded';
    }

    zoomInButton.addEventListener('click', () => setZoom(currentZoom + 0.1));
    zoomOutButton.addEventListener('click', () => setZoom(currentZoom - 0.1));
    zoomResetButton.addEventListener('click', () => setZoom(1));

    diagramWrap.addEventListener('wheel', (event) => {
      if (!event.ctrlKey) {
        return;
      }

      event.preventDefault();
      const zoomDelta = event.deltaY < 0 ? 0.1 : -0.1;
      zoomAtPoint(currentZoom + zoomDelta, event.clientX, event.clientY);
    }, { passive: false });

    diagramWrap.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) {
        return;
      }

      isDragging = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      dragStartScrollLeft = diagramWrap.scrollLeft;
      dragStartScrollTop = diagramWrap.scrollTop;
      diagramWrap.classList.add('dragging');
      diagramWrap.setPointerCapture(event.pointerId);
    });

    diagramWrap.addEventListener('pointermove', (event) => {
      if (!isDragging) {
        return;
      }

      const deltaX = event.clientX - dragStartX;
      const deltaY = event.clientY - dragStartY;
      diagramWrap.scrollLeft = dragStartScrollLeft - deltaX;
      diagramWrap.scrollTop = dragStartScrollTop - deltaY;
    });

    function stopDragging(event) {
      if (!isDragging) {
        return;
      }

      isDragging = false;
      diagramWrap.classList.remove('dragging');

      if (event && diagramWrap.hasPointerCapture(event.pointerId)) {
        diagramWrap.releasePointerCapture(event.pointerId);
      }
    }

    diagramWrap.addEventListener('pointerup', stopDragging);
    diagramWrap.addEventListener('pointercancel', stopDragging);
    diagramWrap.addEventListener('pointerleave', stopDragging);

    document.addEventListener('keydown', (event) => {
      const target = event.target;
      const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
      const isEditable = target && (target.isContentEditable || tagName === 'input' || tagName === 'textarea' || tagName === 'select');

      if (isEditable) {
        return;
      }

      if (event.key === '+' || event.key === '=' || event.key === 'Add') {
        event.preventDefault();
        setZoom(currentZoom + 0.1);
      } else if (event.key === '-' || event.key === '_' || event.key === 'Subtract') {
        event.preventDefault();
        setZoom(currentZoom - 0.1);
      } else if (event.key === '0') {
        event.preventDefault();
        setZoom(1);
      }
    });

    filePicker.addEventListener('change', async (event) => {
      const [file] = event.target.files || [];
      if (!file) {
        return;
      }

      try {
        statusText.textContent = `Loading ${file.name}…`;
        await renderMermaidSource(await file.text(), `${file.name} (local)`);
      } catch (error) {
        diagramSource.innerHTML = `<pre style="color:#b91c1c; white-space:pre-wrap; padding:16px;">Failed to render Mermaid diagram.\n\n${error.message}</pre>`;
        statusText.textContent = 'Mermaid failed to load';
      } finally {
        event.target.value = '';
      }
    });

    saveSvgButton.addEventListener('click', async () => {
      setExportState(saveSvgButton, 'Saving…', true);
      try {
        statusText.textContent = 'Saving SVG…';
        await exportSvg();
        statusText.textContent = 'Saved SVG';
      } catch (error) {
        statusText.textContent = error.message;
      } finally {
        setExportState(saveSvgButton, 'Saving…', false);
      }
    });

    savePngButton.addEventListener('click', async () => {
      setExportState(savePngButton, 'Saving…', true);
      try {
        statusText.textContent = 'Saving PNG…';
        await exportPng();
        statusText.textContent = 'Saved PNG';
      } catch (error) {
        statusText.textContent = error.message;
      } finally {
        setExportState(savePngButton, 'Saving…', false);
      }
    });

    async function renderDiagram() {
      if (!window.mermaid) {
        throw new Error('Mermaid library did not load. If you opened the file locally, the browser may be blocking remote scripts or network access may be unavailable.');
      }

      statusText.textContent = `Loading ${mermaidSourcePath}…`;
      const diagramText = normalizeMermaidSource(await loadDiagramSource(mermaidSourcePath));

      if (!diagramText) {
        throw new Error(`No Mermaid content found in ${mermaidSourcePath}`);
      }

      diagramSource.textContent = diagramText;
      pageTitle.textContent = getFileName(mermaidSourcePath);
      document.title = `${getFileName(mermaidSourcePath)} - Mermaid Viewer`;

      mermaid.initialize(screenMermaidConfig);

      await renderMermaidSource(await loadDiagramSource(mermaidSourcePath), mermaidSourcePath);
    }

    renderDiagram().catch((error) => {
      diagramSource.innerHTML = `<pre style="color:#b91c1c; white-space:pre-wrap; padding:16px;">Failed to render Mermaid diagram.\n\n${error.message}</pre>`;
      statusText.textContent = 'Mermaid failed to load';
    });
  </script>
</body>
</html>
