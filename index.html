<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaider - Render Mermaid Diagrams</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mermaider</h1>
    </header>
    <main>
        <section id="editor-section">
            <textarea id="mermaid-input" placeholder="Enter Mermaid syntax here...
graph TD;
    A-->B;
    A-->C;
    B-->D;
    C-->D;"></textarea>
        </section>
        <section id="preview-section">
            <div id="mermaid-output" class="mermaid"></div>
        </section>
    </main>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });

        const input = document.getElementById('mermaid-input');
        const output = document.getElementById('mermaid-output');

        async function renderDiagram() {
            const code = input.value.trim();
            if (!code) {
                output.innerHTML = '';
                return;
            }

            try {
                // Clear previous output
                output.innerHTML = '';
                // Generate unique ID for the render
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                const { svg } = await mermaid.render(id, code);
                output.innerHTML = svg;
            } catch (error) {
                console.error('Mermaid rendering error:', error);
                // Don't clear if error, or show error message
            }
        }

        input.addEventListener('input', renderDiagram);
        
        // Initial render
        renderDiagram();
    </script>
</body>
</html>
